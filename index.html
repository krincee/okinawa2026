function tripDayIndex(){
  const now = new Date();

  const y = hkDate.getFullYear(), m = hkDate.getMonth(), d = hkDate.getDate();
  const start = new Date(2026,10,11);
  const end = new Date(2026,10,15);
  const current = new Date(y,m,d);
  if(current < start) return -1;
  if(current > end) return DAYS.length - 1;
  const diff = Math.floor((current - start)/(1000*60*60*24));
  return Math.max(0, Math.min(DAYS.length-1, diff));
}

function photoQueryFor(stop){

async function loadPlacePhotos(){
 const holders=[...document.querySelectorAll('[data-photo-query]')];
 await Promise.all(holders.map(async holder=>{
   const search=holder.dataset.photoQuery;
   const cacheKey='photo_v2_'+search;
   let result=null;
   try{
     const saved=localStorage.getItem(cacheKey);
     if(saved) result=JSON.parse(saved);
     if(!result){
       const api='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(search)+'&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=1100&format=json&origin=*';
       const response=await fetch(api);
       if(!response.ok) throw new Error('Commons API unavailable');
       const json=await response.json();
       const pages=Object.values(json.query?.pages||{}).filter(p=>p.imageinfo?.[0]);
       const bad=/logo|illustration|drawing|poster|map|icon|diagram|plan|advertisement|flyer|banner|flag|symbol|sign only|mascot|render|3d/i;
       const good=pages.filter(p=>!bad.test(p.title) && /\.(jpg|jpeg|png|webp)$/i.test(p.title));
       const words=search.toLowerCase().split(/\s+/).filter(w=>w.length>3&&!['okinawa','japan','on the','naka','onna'].includes(w));
       good.sort((a,b)=>words.filter(w=>b.title.toLowerCase().includes(w)).length-words.filter(w=>a.title.toLowerCase().includes(w)).length);
       const best=good.find(p=>words.length ? words.some(w=>p.title.toLowerCase().includes(w)) : true);
       result=best?{url:best.imageinfo[0].thumburl||best.imageinfo[0].url,source:best.imageinfo[0].descriptionurl,title:best.title}:null;
       if(result) localStorage.setItem(cacheKey,JSON.stringify(result));
     }
   }catch(e){}
   if(!holder.isConnected) return;
   const more=holder.querySelector('.reality-more').outerHTML;
   if(result?.url){
     holder.innerHTML='<img loading="lazy" alt="'+esc(holder.dataset.photoName)+' 實景照片（Wikimedia Commons）" src="'+esc(result.url)+'"><div class="reality-credit">實景來源：<a href="'+esc(result.source)+'" target="_blank" rel="noopener">Wikimedia Commons · '+esc(result.title.replace(/^File:/,''))+'</a>（授權詳情見原頁）</div>'+more;
     holder.querySelector('img').onerror=()=>{holder.innerHTML='<div class="photo-notfound">未找到可靠公開實景相片，請按下面連結睇 Google Maps 相簿。</div>'+more};
   }else holder.innerHTML='<div class="photo-notfound">暫未找到可直接顯示嘅公開實景照片，請按下面連結查看真實照片。</div>'+more;
 }));
}
let weatherCache=new Map();
async function loadWeatherCard(day,id){
 const box=document.getElementById(id);if(!box)return;
 const key='2026-11-'+String(10+day.day).padStart(2,'0');
 let w=null,error='';
 try{
  const cached=weatherCache.get(key);
  if(cached && Date.now()-cached.ts<30*60*1000)w=cached.value;
  else{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+day.coords.lat+'&longitude='+day.coords.lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16&current=temperature_2m,weather_code&temperature_unit=celsius';
    const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw Error('weather API '+r.status);
    const j=await r.json();
    const idx=j.daily?.time?.indexOf(key)??-1;
    if(idx>=0 && Number.isFinite(j.daily.temperature_2m_max[idx])){
     w={code:j.daily.weather_code[idx],max:j.daily.temperature_2m_max[idx],min:j.daily.temperature_2m_min[idx],rain:j.daily.precipitation_probability_max[idx],fetched:new Date().toLocaleString('zh-HK',{timeZone:'Asia/Tokyo'})};
     weatherCache.set(key,{ts:Date.now(),value:w});
    }else error='尚未進入可預報日期範圍';
  }
 }catch(e){error='無法連接 Open-Meteo，請檢查網絡';}
 if(!box.isConnected)return;
 let result=w?weatherCodeToText(w.code):['☁️','尚未取得天氣預報'];
 const top='<div class="weather-top"><div class="weather-main"><div class="weather-icon">'+result[0]+'</div><div><div class="weather-temp">'+(w?Math.round(w.max)+'° / '+Math.round(w.min)+'°':'等待預報')+'</div><div class="weather-text">'+result[1]+' · '+esc(day.coords.place)+(w?'<br>降雨機率：'+(w.rain??'—')+'%':'<br>'+error)+'</div></div></div><span class="badge">Open-Meteo</span></div>';
 const o=day.outfit;
 box.innerHTML=top+'<div class="weather-updated">'+(w?'天氣預報最近讀取：'+esc(w.fetched)+' JST · 每次開頁會檢查更新（最多快取30分鐘）':'不是即時預報 · '+esc(error))+'</div>'+
 `<div class="swatch-grid"><div class="swatch-row"><div class="swatch-label">大吉</div><div class="swatches">${swatch(o.best)}</div></div><div class="swatch-row"><div class="swatch-label">次吉</div><div class="swatches">${swatch(o.second)}</div></div><div class="swatch-row"><div class="swatch-label">不宜</div><div class="swatches">${swatch(o.avoid)}</div></div></div><div class="tip-box"><strong>穿搭色彩建議（目前為設計配色，並非已核算的每日五行）：</strong>${esc(o.tip)}</div>`;
}

const getExpenses=()=>ls.get('okinawa_expenses',[]), saveExpenses=v=>ls.set('okinawa_expenses',v);
// Google Sheets cloud sync: Apps Script /exec
const SHEET_API='https://script.google.com/macros/s/AKfycbzmo-i2saDXEM-7u9VmN6nieBf3F4gXgiD3GVd4IEQVwUja8svzofquPSsoBysn_Nv3/exec';
let cloudBusy=false, cloudLastRefresh=0, cloudError='';
function syncNotice(){
 const el=document.getElementById('cloudStatus');
 if(el)el.textContent=cloudBusy?'☁️ 正在同步 Google Sheet…':cloudError?'⚠️ 同步失敗：'+cloudError:'✅ 已連接 Google Sheet · 兩部手機共用';
}
async function cloudRequest(action, payload=null){
 const opts=payload===null?{method:'GET',cache:'no-store'}:{method:'POST',body:new URLSearchParams({action,...Object.fromEntries(Object.entries(payload).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v)]))})};
 const target=payload===null?SHEET_API+'?action='+encodeURIComponent(action)+'&_='+Date.now():SHEET_API;
 const r=await fetch(target,opts);
 if(!r.ok)throw Error('HTTP '+r.status);
 let result;
 try{result=await r.json()}catch(e){throw Error('Google Apps Script 無法讀取回應；請確認 Web app 公開權限設定')}
 if(!result.ok)throw Error(result.error||'Cloud request rejected');
 return result;
}
async function cloudRefresh(force=false){
 if(cloudBusy||(!force&&Date.now()-cloudLastRefresh<25000))return;
 cloudBusy=true;cloudError='';syncNotice();
 try{
   const d=await cloudRequest('getAll');
   saveExpenses(d.expenses||[]);
   ls.set('okinawa_packing',d.packing||{});
   cloudLastRefresh=Date.now();
   // Only redraw the current screen; protect any currently typed form
   if(activeScreen==='money')renderMoney();
   if(activeScreen==='packing')renderPacking();
 }catch(e){cloudError=e.message||String(e)}
 finally{cloudBusy=false;syncNotice()}
}
async function cloudWrite(action,payload){
 cloudBusy=true;cloudError='';syncNotice();
 try{const d=await cloudRequest(action,payload);cloudBusy=false;await cloudRefresh(true);return d}
 catch(e){cloudBusy=false;cloudError=e.message||String(e);syncNotice();throw e}
}

function renderMoney(){ const expenses=getExpenses(); const totals=expenses.reduce((a,e)=>{a[e.currency]=(a[e.currency]||0)+Number(e.amount||0); return a;},{HKD:0,JPY:0}); const balance=Object.fromEntries(PARTICIPANTS.map(p=>[p,{HKD:0,JPY:0}])); expenses.forEach(e=>{ const amt=Number(e.amount||0), c=e.currency; balance[e.paidBy][c]+=amt; const split=amt/(e.sharedWith?.length||1); (e.sharedWith||[]).forEach(p=>balance[p][c]-=split); }); $('#money').innerHTML=header('MONEY','2 PEOPLE<br>split bills')+`<div class="pad"><div class="panel"><h3>Trip Expenses</h3><div id="cloudStatus" class="small">☁️ 正在檢查雲端連線…</div><button onclick="cloudRefresh(true)" class="link-btn" style="margin:10px 0">↻ SYNC NOW</button><div class="small">今次沿用上次 app 嘅記帳概念，但簡化為二人版。支援 HKD / JPY，Google Sheet 雲端同步；本機另備有資料快取與 JSON 備份。</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div class="card" style="margin:0;padding:14px"><div class="kicker">HKD Total</div><div class="big" style="font-size:26px">HK$ ${totals.HKD.toFixed(2)}</div></div><div class="card" style="margin:0;padding:14px"><div class="kicker">JPY Total</div><div class="big" style="font-size:26px">¥ ${totals.JPY.toFixed(0)}</div></div></div></div><div class="panel"><h3>Add Expense</h3><input id="expTitle" class="field" placeholder="例如：MOSS Birthday Dinner"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="expAmount" class="field" type="number" step="0.01" placeholder="Amount"><select id="expCurrency" class="field"><option>JPY</option><option>HKD</option></select></div><select id="expPaid" class="field">${PARTICIPANTS.map(p=>`<option>${p}</option>`).join('')}</select><div class="small" style="margin-top:8px">預設兩個人平分；如果係單人消費，可以取消其中一位。</div><label class="check-row"><input id="share0" type="checkbox" checked><span>Krince 有份</span></label><label class="check-row"><input id="share1" type="checkbox" checked><span>Partner 有份</span></label><div style="height:10px"></div><button class="primary" onclick="addExpense()">ADD EXPENSE</button></div><div class="panel"><h3>Balance</h3>${PARTICIPANTS.map(p=>`<div class="balance"><span><b>${p}</b></span><span style="text-align:right"><b>HK$ ${balance[p].HKD.toFixed(2)}</b><br><b>¥ ${Math.round(balance[p].JPY)}</b></span></div>`).join('')}<div class="small" style="margin-top:8px">正數＝應收；負數＝應付。由於係二人版，只要互相對返同一個貨幣即可。</div></div><div class="panel"><h3>Expense Log</h3>${expenses.length ? expenses.map((e,idx)=>`<div class="exp-item"><div><b>${esc(e.title)}</b><div class="small">${esc(e.currency)} · Paid by ${esc(e.paidBy)} · Shared with ${e.sharedWith.join(', ')}</div></div><div style="text-align:right"><b>${e.currency==='HKD'?'HK$':'¥'} ${Number(e.amount).toFixed(e.currency==='HKD'?2:0)}</b><br><button onclick="removeExpense(${idx})" style="border:0;background:none;color:#94aabd;font-weight:900">Delete</button></div></div>`).join('') : `<div class="small">未有任何支出紀錄。</div>`}</div><div class="panel"><h3>Back Up Data</h3><button class="primary" onclick="exportData()">EXPORT JSON BACKUP</button><div style="height:8px"></div><input type="file" class="field" accept=".json" onchange="importData(this.files[0])"></div></div>`; }
async function addExpense(){
 const title=$('#expTitle').value.trim();const amount=Number($('#expAmount').value);
 if(!title||!Number.isFinite(amount)||amount<=0){alert('請先輸入有效項目同金額');return}
 const shared=[];if($('#share0').checked)shared.push('Krince');if($('#share1').checked)shared.push('Partner');
 if(!shared.length){alert('至少揀一位分攤者');return}
 const expense={id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),title,amount,currency:$('#expCurrency').value,paidBy:$('#expPaid').value,sharedWith:shared,at:new Date().toISOString()};
 if(!navigator.onLine){alert('暫時離線，為避免兩部手機資料唔一致，請連線後再入數。');return}
 try{await cloudWrite('addExpense',{expense});alert('✅ 已儲存至 Google Sheet')}
 catch(e){alert('未能確認儲存，請先刷新 Sheet 檢查有冇重複項目，唔好即刻重複按：'+e.message)}
}

 if(!confirm('確定刪除「'+entry.title+'」？刪除會同步至 Google Sheet。'))return;
 try{await cloudWrite('deleteExpense',{id:entry.id})}catch(e){alert('刪除未成功：'+e.message)}
}
